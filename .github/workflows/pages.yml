# Runs the PVT test suite on every pull request, and on a push to main
# publishes the static site to GitHub Pages -- but only after that suite
# passes, so a broken correlation never reaches the live page.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
# Pull-request runs get their own group per branch, so a new push to a PR
# cancels that PR's previous run without ever touching a live deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pvt-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: PVT regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the correlation test suite
        run: node pvt/tests/run-tests.js

  deploy:
    name: Deploy
    needs: test
    # a pull request runs the tests only; nothing is published until it lands
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
